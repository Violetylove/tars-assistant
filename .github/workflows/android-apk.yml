name: Build Android APK

# 每次推送 tag（v*）就编译安卓 APK；也支持手动触发（workflow_dispatch）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses + install platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name APK
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            apk_name="TARS-Assistant-${GITHUB_REF_NAME}.apk"
          else
            apk_name="TARS-Assistant-debug.apk"
          fi
          mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/${apk_name}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: tars-android-debug-apk
          path: android/app/build/outputs/apk/debug/TARS-Assistant-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: TARS Assistant ${{ github.ref_name }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/TARS-Assistant-*.apk
          fail_on_unmatched_files: true
