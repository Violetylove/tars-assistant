# TARS Agent 配置
# 对齐 docs/DESIGN.md §5/§8/§8.1

server:
  host: "127.0.0.1"      # D6: 只监听本机 loopback，不暴露局域网
  port: 8080

# 模型档位（D3）：直接改 model 档位即可 3B→7B，不改代码
llm:
  base_url: "http://127.0.0.1:11434/v1"  # llama-server OpenAI 兼容端点（可改端口）
  model: "qwen2.5:3b"
  api_key: "not-needed"
  timeout_seconds: 60

# 默认模型档位映射：调用的具体 GGUF 文件 / 进程参数
model_tiers:
  default:
    name: "Qwen2.5-3B-Instruct GGUF Q4_K_M"
    gguf: "models/qwen2.5-3b-instruct-q4_k_m.gguf"
    desc: "约 2GB，8K 上下文，默认档"
  optional_7b:
    name: "Qwen2.5-7B-Instruct GGUF Q4"
    gguf: "models/qwen2.5-7b-instruct-q4_k_m.gguf"
    desc: "约 4GB，需 >=8GB RAM 手机"

# llama-server 按需拉起生命周期（D5 / DESIGN.md §8.1）
llama_server:
  idle_shutdown_seconds: 60   # 任务结束 + 空闲超时退出
  startup_timeout_seconds: 30 # 拉起后等待就绪上限
  process_label: "llama-server"
